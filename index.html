<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memory Match</title>
<style>
  body { background:#181818; color:#fff; text-align:center; font-family:sans-serif; }
  .grid { display:grid; grid-template-columns:repeat(4,100px); gap:10px; justify-content:center; margin-top:20px; }
  .card { 
    width:100px; height:100px; 
    background:#444; 
    cursor:pointer; 
    display:flex; justify-content:center; align-items:center;
    font-size:2rem; 
    border-radius:10px;
    transition: transform 0.3s;
  }
  .card.matched { background:#2ecc71; color:#fff; cursor:default; }
  .card.revealed { transform: rotateY(180deg); }
  #score, #misclicks { margin-top:20px; font-size:1.2rem; }
  .game-over { color:red; font-weight:bold; margin-top:10px; display:none; }
  .win-message { color:lime; font-weight:bold; margin-top:10px; display:none; }
</style>
</head>
<body>
<h1>Memory Match</h1>
<p>Flip cards to find the matching pairs!</p>
<div class="grid" id="grid"></div>
<p id="score">Matched Pairs: 0</p>
<p id="misclicks">Misclicks: 0</p>
<p class="game-over">Too many misclicks - GAME OVER! Press any key to restart.</p>
<p class="win-message">You Win! 🎉 Press any key to play again.</p>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(function () {
    const grid = $('#grid')[0];
    const maxMisclicks = 10;
    let misclicks = 0;
    let gameOver = false;
    let win = false;

    const cardValues = ['🍎','🍌','🍇','🍓','🍒','🥝','🍍','🍉'];
    let cards = [];

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let matchedPairs = 0;

    function resetTurn() {
        [firstCard, secondCard, lockBoard] = [null, null, false];
    }

    function updateScore() {
        $('#score').text(`Matched Pairs: ${matchedPairs}`);
    }

    function updateMisclicks() {
        $('#misclicks').text(`Misclicks: ${misclicks}`);
    }

    function triggerWin() {
        win = true;
        $('.win-message').fadeIn();
        $('.card').off('click');
    }

    function triggerGameOver() {
        gameOver = true;
        $('.game-over').fadeIn();
        $('.card').off('click');
    }

    function restartGame() {
        $('.game-over, .win-message').hide();
        $('#grid').empty();
        misclicks = 0;
        matchedPairs = 0;
        updateMisclicks();
        updateScore();
        gameOver = false;
        win = false;
        initializeCards();
    }

    function initializeCards() {
        cards = [...cardValues, ...cardValues];
        cards.sort(() => 0.5 - Math.random());

        cards.forEach(value => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.value = value;
            grid.appendChild(card);

            card.addEventListener('click', () => {
                if (lockBoard || card === firstCard || card.classList.contains('matched') || gameOver || win) return;

                card.textContent = value; 
                card.classList.add('revealed');

                if (!firstCard) {
                    firstCard = card;
                    return;
                }

                secondCard = card;

                if (firstCard.dataset.value === secondCard.dataset.value) {
                    firstCard.classList.add('matched');
                    secondCard.classList.add('matched');
                    matchedPairs++;
                    updateScore();
                    resetTurn();

                    if (matchedPairs === cardValues.length) {
                        triggerWin();
                    }
                } else {
                    lockBoard = true;
                    setTimeout(() => {
                        firstCard.textContent = '';
                        secondCard.textContent = '';
                        firstCard.classList.remove('revealed');
                        secondCard.classList.remove('revealed');
                        resetTurn();
                        misclicks++;
                        updateMisclicks();
                        if (misclicks >= maxMisclicks) triggerGameOver();
                    }, 1000);
                }
            });
        });
    }

    // Restart on ANY key press (after win or lose)
    $(document).on('keydown', () => {
        if (gameOver || win) restartGame();
    });

    // Start the game for the first time
    initializeCards();
});
</script>
</body>
</html>
