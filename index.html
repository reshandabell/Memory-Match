<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memory Match</title>
<style>
  body { background:#181818; color:#fff; text-align:center; font-family:sans-serif; }
  .grid { display:grid; grid-template-columns:repeat(4,100px); gap:10px; justify-content:center; margin-top:20px; }
  .card { 
    width:100px; height:100px; 
    background:#444; 
    cursor:pointer; 
    display:flex; justify-content:center; align-items:center;
    font-size:2rem; 
    border-radius:10px;
    transition: transform 0.3s;
  }
  .card.matched { background:#2ecc71; color:#fff; cursor:default; }
  .card.revealed { transform: rotateY(180deg); }
  #score { margin-top:20px; font-size:1.2rem; }
</style>
</head>
<body>
<h1>Memory Match</h1>
<p>Flip cards to find the matching pairs!</p>
<div class="grid" id="grid"></div>
<p id="score">Matched Pairs: 0</p>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(function () {
    const grid = $('#grid')[0];

    //////////////////////////////////
    // ONLY CHANGE BELOW THIS POINT //
    //////////////////////////////////

    // TODO 1 - Create a shuffled deck of paired values (using emojis for color/pictures)
    const cardValues = ['🍎','🍌','🍇','🍓','🍒','🥝','🍍','🍉'];
    let cards = [...cardValues, ...cardValues];
    cards.sort(() => 0.5 - Math.random());

    // TODO 2 - Reveal cards and check for matches
    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let matchedPairs = 0;

    function resetTurn() {
        [firstCard, secondCard, lockBoard] = [null, null, false];
    }

    function updateScore() {
        $('#score').text(`Matched Pairs: ${matchedPairs}`);
    }

    function checkWin() {
        if (matchedPairs === cardValues.length) {
            setTimeout(() => alert("You Win! 🎉"), 200);
        }
    }

    // Create card elements and add click events
    cards.forEach(value => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.value = value;
        grid.appendChild(card);

        card.addEventListener('click', () => {
            if (lockBoard || card === firstCard || card.classList.contains('matched')) return;

            card.textContent = value; 
            card.classList.add('revealed');

            if (!firstCard) {
                firstCard = card;
                return;
            }

            secondCard = card;

            if (firstCard.dataset.value === secondCard.dataset.value) {
                firstCard.classList.add('matched');
                secondCard.classList.add('matched');
                matchedPairs++;
                updateScore();
                checkWin();
                resetTurn();
            } else {
                lockBoard = true;
                setTimeout(() => {
                    firstCard.textContent = '';
                    secondCard.textContent = '';
                    firstCard.classList.remove('revealed');
                    secondCard.classList.remove('revealed');
                    resetTurn();
                }, 1000);
            }
        });
    });

    //////////////////////////////////
    // ONLY CHANGE ABOVE THIS POINT //
    //////////////////////////////////
});
</script>
</body>
</html>
